server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API. The browser talks only to this nginx, which reaches
    # the backend on the compose network. Avoids blocked :8000 and CORS.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # SPA routing — all non-file paths go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not cache the HTML shell (deploy freshness)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Prefer precompressed .gz from the image build so the NAS CPU does not
    # compress the JS bundle on each cold request.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
